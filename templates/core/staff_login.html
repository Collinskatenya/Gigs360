<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HQ Terminal Access | Gigs360</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        /* Gigs360 Enterprise Dark Theme */
        body { 
            background-color: #1B2134; 
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
        }
        
        .login-box { 
            background-color: #2A344A; 
            padding: 40px; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 420px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); 
            border-top: 5px solid #E5B314;
        }
        
        .hq-brand {
            color: white;
            font-weight: 800;
            letter-spacing: 1px;
            font-size: 1.5rem;
        }
        
        .hq-brand i { color: #E5B314; }
        
        .badge-hq {
            background-color: #E5B314;
            color: #1B2134;
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 4px;
            vertical-align: super;
        }

        .form-control { 
            background-color: #1B2134; 
            border: 1px solid #3d4a6b; 
            color: white; 
            padding: 12px 15px;
        }
        
        .form-control:focus { 
            background-color: #1B2134; 
            color: white; 
            border-color: #E5B314; 
            box-shadow: 0 0 0 0.25rem rgba(229, 179, 20, 0.25); 
        }
        
        .btn-gold { 
            background-color: #E5B314; 
            color: #1B2134; 
            font-weight: 700; 
            width: 100%; 
            padding: 12px; 
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }
        
        .btn-gold:hover { 
            background-color: #cda00e; 
            color: #1B2134; 
            transform: translateY(-2px);
        }

        .alert-error {
            background-color: rgba(220, 53, 69, 0.1);
            border: 1px solid #dc3545;
            color: #ff6b6b;
            font-size: 0.85rem;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="text-center mb-4">
            <div class="hq-brand mb-1"><i class="bi bi-shield-lock-fill me-2"></i>Gigs360 <span class="badge-hq">COMMAND</span></div>
            <p class="text-secondary" style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;">Authorized Personnel Only</p>
        </div>
        
        {% if form.errors %}
            <div class="alert-error mb-4 text-center">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> Authentication Failed. Invalid credentials.
            </div>
        {% endif %}

        <form method="post" action="{% url 'staff_login' %}">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label text-secondary fw-bold" style="font-size: 0.85rem;">ADMIN ID / EMAIL</label>
                <div class="input-group">
                    <span class="input-group-text" style="background-color: #1B2134; border-color: #3d4a6b; color: #A0ABC0;">
                        <i class="bi bi-person-fill"></i>
                    </span>
                    <input type="text" name="username" class="form-control" placeholder="Enter your credentials..." required autofocus>
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label text-secondary fw-bold" style="font-size: 0.85rem;">SECURE PASSPHRASE</label>
                <div class="input-group">
                    <span class="input-group-text" style="background-color: #1B2134; border-color: #3d4a6b; color: #A0ABC0;">
                        <i class="bi bi-key-fill"></i>
                    </span>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>
            
            <button type="submit" class="btn btn-gold">
                <i class="bi bi-box-arrow-in-right me-2"></i> INITIATE LOGIN
            </button>
            
            <input type="hidden" name="next" value="{{ next|default:'/staff/' }}">
        </form>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Protected Gallery | {{ gallery.title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Jost', sans-serif; background-color: #f9fafb; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .pin-card { background: white; padding: 60px 50px; border-radius: 4px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); width: 100%; max-width: 450px; text-align: center; border: 1px solid #f3f4f6; }
        .gallery-title { font-weight: 500; font-size: 1.8rem; color: #111827; letter-spacing: 1px; margin-bottom: 5px; }
        .photographer-name { font-size: 0.75rem; color: #6b7280; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px; }
        
        .pin-input { font-size: 2rem; text-align: center; letter-spacing: 12px; border: none; border-bottom: 1px solid #d1d5db; border-radius: 0; padding: 10px 0; outline: none; transition: border-color 0.3s; background: transparent; width: 100%; color: #111827; font-weight: 300;}
        .pin-input:focus { border-bottom-color: #111827; box-shadow: none; }
        
        .btn-enter { background-color: #111827; color: white; text-transform: uppercase; letter-spacing: 2px; font-weight: 500; font-size: 0.8rem; padding: 16px; border-radius: 2px; width: 100%; margin-top: 40px; transition: opacity 0.2s; border: none;}
        .btn-enter:hover { opacity: 0.8; color: white; }
        
        .cover-avatar { width: 80px; height: 80px; margin: 0 auto 20px; border-radius: 50%; overflow: hidden; border: 2px solid #f3f4f6;}
    </style>
</head>
<body>

    <div class="pin-card">
        {% if gallery.cover_image %}
            <div class="cover-avatar">
                <img src="{{ gallery.cover_image.url }}" style="width: 100%; height: 100%; object-fit: cover;" alt="Cover">
            </div>
        {% endif %}
        
        <h2 class="gallery-title">{{ gallery.title }}</h2>
        <div class="photographer-name">{{ gallery.photographer.username }}</div>

        <p class="text-muted small mb-4" style="font-size: 0.85rem;">This collection is protected. Please enter the PIN provided by your photographer.</p>

        <form method="POST">
            {% csrf_token %}
            {% if error %}
                <div class="text-danger small mb-3" style="font-weight: 500;">{{ error }}</div>
            {% endif %}
            <input type="password" name="pin" class="form-control pin-input" maxlength="6" autocomplete="off" autofocus required placeholder="••••••">
            <button type="submit" class="btn-enter">Enter Gallery</button>
        </form>
    </div>

</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Unavailable | Gigs360</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        body { 
            background-color: #f8fafc; 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
        }
        .status-card {
            background: #ffffff;
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border-radius: 1.5rem;
            max-width: 480px;
            width: 100%;
        }
        .icon-wrapper {
            width: 88px;
            height: 88px;
            background: rgba(245, 158, 11, 0.1); /* Soft Gold tint */
            color: #F59E0B; /* Electric Gold */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            /* Subtle pulse to show work is actively happening */
            animation: pulse-gold 2.5s infinite;
        }
        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }
        .text-slate { color: #0F172A; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100 p-3">
    
    <div class="status-card p-5 text-center">
        <div class="icon-wrapper mb-4">
            <i class="bi bi-clock-history display-4"></i>
        </div>
        
        <h3 class="fw-bolder text-slate mb-3">Gallery Not Yet Available</h3>
        <p class="text-muted mb-0" style="line-height: 1.6;">
            The creative team is currently putting the final touches on your media. Please check back later or contact your vendor directly.
        </p>

        <div class="mt-5 pt-4 border-top">
            <span class="text-muted small fw-bold tracking-widest text-uppercase" style="letter-spacing: 0.1em; font-size: 0.7rem;">
                <i class="bi bi-lightning-charge-fill" style="color: #F59E0B;"></i> Powered by Gigs360
            </span>
        </div>
    </div>

</body>
</html>

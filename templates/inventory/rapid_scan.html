{% extends 'core/dashboard_base.html' %}
{% load static %}

{% block dashboard_content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 text-center">
            
            <div class="mb-4">
                <h2 class="fw-bold" style="color: #003366;">⚡ Rapid Scanner</h2>
                <p class="text-muted small">
                    System is in <strong>Smart Mode</strong>. Just scan an item to toggle its status (Check-In ↔ Check-Out).
                </p>
            </div>
            
            <div class="card shadow-lg border-0 overflow-hidden mb-3">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center small">
                    <span><i class="bi bi-camera-video-fill me-2"></i>Live Feed</span>
                    <span class="badge bg-success animate__animated animate__pulse animate__infinite">Active</span>
                </div>
                <div class="card-body p-0 bg-black position-relative">
                    <div id="reader" style="width: 100%; min-height: 350px;"></div>
                    
                    <div class="position-absolute top-50 start-50 translate-middle pointer-events-none" style="opacity: 0.5;">
                        <i class="bi bi-qr-code-scan text-white" style="font-size: 3rem;"></i>
                    </div>
                </div>
            </div>

            <div class="text-start">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="text-uppercase text-muted fw-bold small m-0">Session History</h6>
                    <button class="btn btn-sm btn-link text-decoration-none small p-0" onclick="clearLog()">Clear</button>
                </div>
                
                <ul id="scan-log" class="list-group list-group-flush shadow-sm rounded border-0">
                    <li class="list-group-item text-center text-muted small fst-italic" id="empty-msg">Waiting for scan...</li>
                </ul>
            </div>

        </div>
    </div>
</div>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<script>
    let isScanning = false;
    const SUCCESS_COOLDOWN = 3000; // 3 Seconds wait after success
    const ERROR_COOLDOWN = 1000;   // 1 Second wait after error

    // --- 1. SUCCESS HANDLER ---
    function onScanSuccess(decodedText, decodedResult) {
        if (isScanning) return; 
        isScanning = true;

        // Play Beep (Optional)
        // new Audio('/static/audio/beep.mp3').play().catch(e => console.log("Audio blocked"));

        // Call Backend
        fetch("{% url 'inventory:scan_api' %}", {
            method: 'POST',
            headers: {
                'X-CSRFToken': '{{ csrf_token }}',
                'Content-Type': 'application/json'
            },
            // FIX 1: Send 'uuid' to match Backend Expectation
            body: JSON.stringify({ uuid: decodedText }) 
        })
        .then(response => {
            if (!response.ok) throw new Error("Server Error");
            return response.json();
        })
        .then(data => {
            // Update UI
            updateLog(data);
            
            // Re-enable scanning after cooldown
            setTimeout(() => { isScanning = false; }, SUCCESS_COOLDOWN);
        })
        .catch(err => {
            console.error("Scan Error:", err);
            // Handle Network Errors gracefully
            updateLog({status: 'error', message: 'Network or Server Error', item_name: 'System'});
            setTimeout(() => { isScanning = false; }, ERROR_COOLDOWN);
        });
    }

    // --- 2. UPDATE LOG UI ---
    function updateLog(data) {
        let logContainer = document.getElementById('scan-log');
        let emptyMsg = document.getElementById('empty-msg');
        if (emptyMsg) emptyMsg.remove();

        let li = document.createElement("li");
        
        // Determine Styling based on Backend Response
        // Backend sends: 'success', 'warning', 'error'
        let icon = 'bi-check-circle-fill';
        let colorClass = 'text-success';
        
        if (data.status === 'warning') {
            icon = 'bi-exclamation-circle-fill';
            colorClass = 'text-warning';
        } else if (data.status === 'error') {
            icon = 'bi-x-circle-fill';
            colorClass = 'text-danger';
        }

        // FIX 2: Use 'data.item_name' (matches your Backend View)
        let itemName = data.item_name || 'Unknown Item';

        li.className = "list-group-item d-flex justify-content-between align-items-center animate__animated animate__fadeInDown bg-white border-bottom";
        li.innerHTML = `
            <div class="d-flex align-items-center">
                <i class="bi ${icon} ${colorClass} fs-4 me-3"></i>
                <div style="line-height: 1.2;">
                    <span class="fw-bold text-dark d-block">${itemName}</span>
                    <small class="${colorClass} fw-bold" style="font-size: 0.75rem;">${data.message}</small>
                </div>
            </div>
            <span class="badge bg-light text-secondary border">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'})}</span>
        `;

        logContainer.insertBefore(li, logContainer.firstChild);
        
        // Keep log clean (Max 5 items)
        if (logContainer.children.length > 5) {
            logContainer.removeChild(logContainer.lastElementChild);
        }
    }

    function clearLog() {
        document.getElementById('scan-log').innerHTML = '<li class="list-group-item text-center text-muted small fst-italic" id="empty-msg">Waiting for scan...</li>';
    }

    // --- 3. INITIALIZE ---
    let html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", 
        { fps: 10, qrbox: {width: 250, height: 250} }
    );
    html5QrcodeScanner.render(onScanSuccess);
</script>

<style>
    .animate__fadeInDown {
        animation: fadeInDown 0.4s ease-out;
    }
    @keyframes fadeInDown {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    #reader video {
        border-radius: 0.5rem; /* Rounds the camera feed corners */
        object-fit: cover;
    }
</style>
{% endblock %}

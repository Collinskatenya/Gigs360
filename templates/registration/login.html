{% extends 'base.html' %}

{% block title %}Login | Gigs360{% endblock %}

{% block content %}
<section class="section-auth d-flex align-items-center" style="min-height: 85vh; background: #f8f9fa;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-4 col-md-6">
                
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-header bg-primary text-white text-center py-4">
                        <h4 class="fw-bold mb-1">Welcome Back</h4>
                        <p class="small text-white-50 mb-0">Login to manage your business</p>
                    </div>

                    <div class="card-body p-4 p-md-5 bg-white">
                        <form method="post">
                            {% csrf_token %}
                            
                            {% if form.errors %}
                                <div class="alert alert-danger small p-2 text-center mb-3">
                                    <i class="bi bi-exclamation-circle me-1"></i> Invalid username or password.
                                </div>
                            {% endif %}

                            <div class="form-floating mb-3">
                                <input type="text" name="username" class="form-control" id="id_username" placeholder="Username" required>
                                <label for="id_username">Username</label>
                            </div>

                            <div class="form-floating mb-4">
                                <input type="password" name="password" class="form-control" id="id_password" placeholder="Password" required>
                                <label for="id_password">Password</label>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-3 shadow-sm">
                                Login to Dashboard
                            </button>
                        </form>
                    </div>

                    <div class="card-footer bg-light text-center py-3 border-0">
                        <p class="small mb-1 text-muted">
                            Don't have an account? <a href="{% url 'signup' %}" class="fw-bold text-warning text-decoration-none">Create one</a>
                        </p>
                        <a href="{% url 'password_reset' %}" class="small text-muted text-decoration-underline">Forgot Password?</a>
                    </div>
                </div>

            </div>
        </div>
    </div>
</section>
{% endblock %}
